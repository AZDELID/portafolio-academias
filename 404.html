/* Mismos colores que index.html. Los enlaces empiezan con «/» porque Vercel muestra esta página en cualquier ruta que no exista. */
:root{--card:#fff;--glow1:#dff0ff;--glow2:#e3fbf7;--sel:#eef7ff;--soft:#f1f7fe;--sky:#1a8cf0;--sky-2:#5fb8ff;--teal:#13b5a6;--ink:#10243f;--muted:#5a6b83;--line:#e2ebf5;--wa:#25d366;--display:"Sora","Segoe UI",system-ui,sans-serif;--body:"DM Sans","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:light}
body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr;background:radial-gradient(900px 420px at 85% -10%,var(--glow1) 0,transparent 60%),radial-gradient(700px 380px at -10% 90%,var(--glow2) 0,transparent 55%),var(--card);color:var(--ink);font:400 1rem/1.6 var(--body)}
:focus-visible{outline:3px solid var(--sky-2);outline-offset:3px;border-radius:6px}
.topnav{padding:0 max(16px,env(safe-area-inset-left,0px));min-height:60px;display:flex;align-items:center;max-width:1140px;width:100%;margin:0 auto;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:.55rem;font:700 1rem var(--display);text-decoration:none;color:var(--ink)}
.brand img{width:30px;height:30px;flex:none}.brand b{color:var(--sky);font-weight:inherit}
.nf{display:grid;justify-items:center;align-content:center;text-align:center;gap:1rem;padding:2rem 16px 4rem}
.code{font:700 clamp(6rem,22vw,11rem)/1 var(--display);letter-spacing:-.05em;background:linear-gradient(90deg,var(--sky),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:var(--display);font-size:clamp(1.5rem,3.5vw,2.1rem);margin:0}
p{margin:0;max-width:46ch;color:var(--muted);font-size:1.08rem}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;margin-top:.4rem}
.btn{display:inline-flex;align-items:center;padding:.85rem 1.4rem;border-radius:999px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:linear-gradient(90deg,var(--sky),var(--teal));color:#fff;border-color:transparent}
.wa{font-weight:600;color:#128c4a;text-decoration:none;margin-top:.6rem}
.wa:hover{text-decoration:underline}

/* ===== modo oscuro: lo activa el botón luna/sol o la preferencia del sistema (data-theme en <html>) ===== */
.tema{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .25s}
.tema:hover{transform:rotate(-18deg)}
.tema svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tema .sol,[data-theme="dark"] .tema .luna{display:none}
[data-theme="dark"] .tema .sol{display:block}
.topnav>.tema{margin-left:auto}
:root[data-theme="dark"]{--bg:#0b1626;--card:#122136;--soft:#15263d;--ink:#e6eef8;--muted:#9fb3cb;--line:#24384f;--sky-2:#7cc6ff;color-scheme:dark}
[data-theme="dark"] .topnav{background:rgba(11,22,38,.82)}
[data-theme="dark"] body::before{background:var(--bg)}
/* las maquetas (ventanas de demos, celulares, boletas) se quedan claras, como capturas de una app */
[data-theme="dark"] :is(.app,.devices,.phone,.cel,.recibos){--bg:#fff;--card:#fff;--soft:#f1f7fe;--ink:#10243f;--muted:#5a6b83;--line:#e2ebf5;--sky-2:#5fb8ff;--sel:#eef7ff;color:var(--ink);color-scheme:light}
[data-theme="dark"] .ic{background:rgba(124,198,255,.12)}
:root[data-theme="dark"]{--glow1:rgba(26,140,240,.2);--glow2:rgba(19,181,166,.13);--sel:rgba(26,140,240,.2)}
</style>
<script>/* tema: el guardado manda; si no hay, el del sistema */(function(){var d=document.documentElement,m=matchMedia('(prefers-color-scheme: dark)'),g;try{g=localStorage.getItem('tema')}catch(e){}d.dataset.theme=g||(m.matches?'dark':'light');if(!g&&m.addEventListener)m.addEventListener('change',function(e){d.dataset.theme=e.matches?'dark':'light'});document.addEventListener('click',function(e){if(!e.target.closest('.tema'))return;var t=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=t;try{localStorage.setItem('tema',t)}catch(_){}})})();</script>
</head>
